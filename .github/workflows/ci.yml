name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked

  cross-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-gnu, x86_64-apple-darwin, aarch64-apple-darwin
      - name: Clippy for the other systems
        run: |
          for t in x86_64-pc-windows-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            cargo clippy --all-targets --locked --target "$t" -- -D warnings
          done

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Known vulnerabilities
        run: cargo audit

  macos-helpers:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and self test the Swift helpers
        run: make macos-helpers
      - name: Run the compiled capture helper
        run: TYPEDECK_CAPTURE_HELPER="$PWD/dist/typedeck-capture-macos" cargo test --locked --lib real_helper -- --nocapture

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Editor module tests
        run: node --test tests/web/*.test.mjs
      - name: Generated files are up to date
        run: |
          python3 scripts/gen-packs.py
          python3 scripts/gen-compat-doc.py
          git diff --exit-code src/data/packs.json docs/COMPATIBILITY.md

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: End to end with a simulated board
        run: make e2e-linux

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the X11 tools
        run: sudo apt-get update && sudo apt-get install -y xvfb openbox xdotool xclip x11-utils xterm
      - name: Linux desktop features on a virtual X11
        run: make e2e-desktop

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Editor self test in headless Chrome
        run: make selftest

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
      - name: Build the firmware
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install "USB Host Shield Library 2.0@1.7.0" "HID-Project@2.8.4"
          arduino-cli compile --fqbn arduino:avr:leonardo --output-dir /tmp/typedeck-fw firmware

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,nfpm
      - name: Static Linux binaries and their packages
        run: |
          make platform PLATFORM=linux-amd64 VERSION=v0.0.0-ci
          make platform PLATFORM=linux-arm64 VERSION=v0.0.0-ci
          make packages PREBUILT=1 VERSION=v0.0.0-ci
