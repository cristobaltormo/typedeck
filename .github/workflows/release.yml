name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tests
        run: go test ./...
      - name: Install nfpm
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - uses: arduino/setup-arduino-cli@v2
      - name: Build the firmware
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install "USB Host Shield Library 2.0@1.7.0" "HID-Project@2.8.4"
          arduino-cli compile --fqbn arduino:avr:leonardo --output-dir /tmp/typedeck-fw firmware
          fw=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' firmware/firmware.ino)
          mkdir -p dist
          cp /tmp/typedeck-fw/firmware.ino.hex "dist/typedeck-firmware-$fw.hex"
      - name: Build the binaries
        run: make dist VERSION=${{ github.ref_name }}
      - name: Build the archives and packages
        run: make release-files VERSION=${{ github.ref_name }} PREBUILT=1
      - name: Release notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            dist/typedeck-*
            dist/typedeck_*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/typedeck-* dist/typedeck_* dist/SHA256SUMS --notes-file notes.md --title "${{ github.ref_name }}"
