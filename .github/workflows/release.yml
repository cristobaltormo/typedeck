name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make lint test

  macos-helpers:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the macOS helpers
        run: make macos-helpers
      - uses: actions/upload-artifact@v7
        with:
          name: build-macos-helpers
          path: |
            dist/typedeck-capture-macos
            dist/typedeck-hud-macos
          if-no-files-found: error

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-amd64, target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { platform: linux-arm64, target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { platform: darwin-amd64, target: x86_64-apple-darwin, os: macos-latest }
          - { platform: darwin-arm64, target: aarch64-apple-darwin, os: macos-latest }
          - { platform: windows-amd64, target: x86_64-pc-windows-msvc, os: windows-latest }
          - { platform: windows-arm64, target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        shell: bash
        env:
          TYPEDECK_VERSION: ${{ github.ref_name }}
        run: |
          if [ "${{ matrix.zig }}" = true ]; then build="cargo zigbuild"; else build="cargo build"; fi
          case "${{ matrix.platform }}" in windows-*) exe=.exe; bins="--bin typedeck --bin typedeck-cli" ;; *) exe=""; bins="--bin typedeck" ;; esac
          $build --release --locked --target ${{ matrix.target }} $bins
          mkdir -p dist
          cp target/${{ matrix.target }}/release/typedeck$exe dist/typedeck-${{ matrix.platform }}$exe
          if [ -n "$exe" ]; then cp target/${{ matrix.target }}/release/typedeck-cli.exe dist/typedeck-cli-${{ matrix.platform }}.exe; fi
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.platform }}
          path: dist/typedeck-*
          if-no-files-found: error

  release:
    needs: [build, macos-helpers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nfpm
        run: |
          curl -sSfLo nfpm.tar.gz https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          echo "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  nfpm.tar.gz" | sha256sum -c -
          sudo tar -xzf nfpm.tar.gz -C /usr/local/bin nfpm
          rm nfpm.tar.gz
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - uses: arduino/setup-arduino-cli@v2
      - name: Build the firmware
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install "USB Host Shield Library 2.0@1.7.0" "HID-Project@2.8.4"
          arduino-cli compile --fqbn arduino:avr:leonardo --output-dir /tmp/typedeck-fw firmware
          fw=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' firmware/firmware.ino)
          cp /tmp/typedeck-fw/firmware.ino.hex "dist/typedeck-firmware-$fw.hex"
      - name: Build the archives and packages
        run: make release-files VERSION=${{ github.ref_name }} PREBUILT=1 REQUIRE_MACOS_HELPERS=1
      - name: Release notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            dist/typedeck-*
            dist/typedeck_*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in
            *-*) flags="--prerelease --latest=false" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/typedeck-* dist/typedeck_* dist/SHA256SUMS --notes-file notes.md --title "$GITHUB_REF_NAME" $flags
